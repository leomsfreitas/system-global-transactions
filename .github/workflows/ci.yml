name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-testes:
    name: Build, testes e cobertura
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build + testes unitarios e de integracao (Testcontainers) + JaCoCo >= 80% + Spotless
        run: ./mvnw -B verify
      # Dinheiro so existe em dominio e api. Conectores usam double/float apenas em parametros do
      # Resilience4j (backoff e percentual do circuit breaker), exigidos pela biblioteca.
      - name: Nenhum double/float em codigo de dinheiro
        run: |
          if grep -rnE '\b(double|float|Double|Float)\b' modulos/dominio/src/main/java modulos/api/src/main/java | grep -vE '^\S+:[0-9]+:\s*(//|/?\*)'; then
            echo "::error::Uso de ponto flutuante encontrado no codigo de producao"; exit 1
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: relatorios-testes
          path: |
            modulos/*/target/surefire-reports
            modulos/*/target/site/jacoco
          retention-days: 14

  spec:
    name: Lint da spec OpenAPI (Spectral)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker run --rm -v "$PWD":/w -w /w stoplight/spectral:6.15.0 lint api-spec/openapi.yaml --ruleset .spectral.yaml --fail-severity=warn

  infra:
    name: Terraform fmt, validate e tflint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
      - run: terraform fmt -check -recursive infra
      - name: validate
        run: |
          for d in infra/ambientes/dev infra/ambientes/prod infra/bootstrap-estado; do
            (cd "$d" && terraform init -backend=false -input=false && terraform validate)
          done
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # download do plugin autenticado (evita rate limit da API)
        run: |
          docker run --rm -v "$PWD":/w -w /w -e TFLINT_PLUGIN_DIR=/w/.tflint.d -e GITHUB_TOKEN --entrypoint sh ghcr.io/terraform-linters/tflint:v0.59.1 \
            -c "tflint --init --config=/w/infra/.tflint.hcl && tflint --chdir=infra --recursive --config=/w/infra/.tflint.hcl"

  workflows:
    name: actionlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.7 -color

  seguranca:
    name: Varreduras de seguranca
    uses: ./.github/workflows/seguranca.yml
